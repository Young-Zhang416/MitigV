[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mitigv"
version = "0.1.3"
description = "Training-free hallucination mitigation algorithms for large vision-language models (VCD, PAI, ...)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0,<3"]
authors = [{ name = "MitigV contributors" }]
keywords = ["vision-language-model", "hallucination", "multimodal", "decoding"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Young-Zhang416/MitigV"
Repository = "https://github.com/Young-Zhang416/MitigV.git"
Issues = "https://github.com/Young-Zhang416/MitigV/issues"

[project.optional-dependencies]
transformers = [
    "transformers>=5.0,<6",
    "accelerate>=0.26",
    "pillow>=9",
]
eval = [
    "transformers>=5.0,<6",
    "accelerate>=0.26",
    "pillow>=9",
    "numpy>=1.23",
    "scipy>=1.9",
    "pyarrow>=10",
]
test = [
    "pytest>=7",
    "transformers>=5.0,<6",
    "pillow>=9",
    "numpy>=1.23",
    "scipy>=1.9",
    "ruff>=0.9",
]
all = [
    "transformers>=5.0,<6",
    "accelerate>=0.26",
    "pillow>=9",
    "numpy>=1.23",
    "scipy>=1.9",
    "pyarrow>=10",
]

[project.scripts]
mitigv-chair = "mitigv.evaluation.chair:main"
mitigv-judge = "mitigv.evaluation.judge:main"
mitigv-discriminative = "mitigv.evaluation.discriminative:main"
mitigv-length-analysis = "mitigv.evaluation.length_analysis:main"
mitigv-pope = "mitigv.evaluation.run_pope:main"
mitigv-train-probe = "mitigv.evaluation.train_probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mitigv = ["evaluation/data/*.txt", "evaluation/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
